<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<title>X/O CLASH</title>

<style>
/* ===== BASE ===== */
body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle,#2a0040,#000);
  font-family:sans-serif;
  color:white;
  overflow:hidden;
}

/* ===== TITLE ===== */
#title{
  font-size:77px;
  font-weight:900;
  margin-bottom:20px;
  background:linear-gradient(45deg,#00f0ff,#ff00cc,#baff00,#00f0ff);
  background-size:400%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s linear infinite;
  text-shadow:0 0 30px #fff;
}
@keyframes shine{
  0%{background-position:0%}
  100%{background-position:400%}
}

/* ===== LAYOUT ===== */
#game{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:220px;
}

.side{
  width:220px;
  text-align:center;
  font-size:48px;
  font-weight:900;
  letter-spacing:2px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.symbol{
  font-size:82px;
  margin-bottom:6px;
}

.metal{
  text-shadow:
    0 0 10px #fff,
    0 0 25px #fff,
    0 0 50px #fff;
}

.draw{
  color:#ff0033;
  font-size:90px;
  text-shadow:
    0 0 10px #ffffff,
    0 0 25px #ffffff,
    0 0 20px #ff0033,
    0 0 40px #ff0033,
    0 0 80px #ff0033;
}

/* ===== BOARD ===== */
#board{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,86px);
  gap:12px;
  padding:20px;
  border-radius:50px;
  background:#20003a;
  border:24px solid #00f0ff;
  box-shadow:
    0 0 80px #00f0ff,
    0 0 150px #00f0ff,
    inset 0 0 40px #00f0ff55;
}

/* ===== CELLS ===== */
.cell{
  width:86px;
  height:86px;
  border-radius:30px;
  background:#3a0060;
  display:flex;
  align-items:center;
  justify-content:center;
}

.mark{
  font-size:64px;
  font-weight:900;
}

.x{
  color:#00f0ff;
  text-shadow:0 0 40px #00f0ff;
}
.o{
  color:#ff00cc;
  text-shadow:0 0 40px #ff00cc;
}

/* ===== WIN BEAM ===== */
.win-line{
  position:absolute;
  height:16px;
  pointer-events:none;
  transform-origin:left center;
  z-index:5;

  /* CORE = transparent / black */
  background: linear-gradient(
    to right,
    transparent 0%,
    rgba(0,0,0,0.9) 10%,
    rgba(0,0,0,0.95) 50%,
    rgba(0,0,0,0.9) 90%,
    transparent 100%
  );

  /* EDGE GLOW ONLY */
  box-shadow:
    0 0 10px currentColor,
    0 0 25px currentColor;

  /* SHARP FADING ENDS */
  mask-image: linear-gradient(
    to right,
    transparent,
    black 10%,
    black 90%,
    transparent
  );

  animation:beamBlast 0.35s ease-out forwards,
             beamSettle 0.6s ease-out forwards;
}

@keyframes beamBlast{
  from{
    transform:scaleX(0);
    height:40px;
    opacity:1;
  }
  to{
    transform:scaleX(1);
    height:26px;
    opacity:1;
  }
}

@keyframes beamSettle{
  from{
    height:26px;
    opacity:1;
  }
  to{
    height:12px;
    opacity:0.95;
  }
}

/* ===== BUTTON ===== */
#restart{
  margin-top:40px;
  padding:18px 80px;
  font-size:26px;
  font-weight:900;
  border-radius:60px;
  border:none;
  cursor:pointer;
  background:linear-gradient(#d4ff4d,#a6ff00);
}
</style>
</head>

<body>

<div id="title">X/O CLASH</div>

<div id="game">
  <div id="left" class="side"></div>
  <div id="board"></div>
  <div id="right" class="side"></div>
</div>

<button id="restart">RESTART</button>

<script>

/* ===== STATE ===== */
let boardState = Array(9).fill(null);
let current = "X";
let gameOver = false;

const board = document.getElementById("board");
const left = document.getElementById("left");
const right = document.getElementById("right");
const restartBtn = document.getElementById("restart");

/* ===== SOUND ===== */
let audioCtx;
function playSound(freq){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.frequency.value = freq;
  g.gain.value = 0.2;
  o.connect(g);
  g.connect(audioCtx.destination);
  o.start();
  o.stop(audioCtx.currentTime + 0.1);
}

/* ===== GRID ===== */
for(let i=0;i<9;i++){
  const c=document.createElement("div");
  c.className="cell";
  c.dataset.i=i;
  board.appendChild(c);
}

/* ===== UI ===== */
function updateUI(text){
  left.innerHTML="";
  right.innerHTML="";
  if(text==="DRAW"){
    left.innerHTML=`<span class="draw">DRAW</span>`;
    right.innerHTML=`<span class="draw">DRAW</span>`;
    return;
  }
  left.innerHTML=`<span class="symbol">${current}</span><span>${text}</span>`;
}

/* ===== WIN ===== */
const wins=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

function drawBeam(a,b,c){
  const cells=[a,b,c].map(i=>document.querySelector(`[data-i='${i}']`));
  const r1=cells[0].getBoundingClientRect();
  const r3=cells[2].getBoundingClientRect();
  const br=board.getBoundingClientRect();

  const x1=r1.left+r1.width/2-br.left;
  const y1=r1.top+r1.height/2-br.top;
  const x2=r3.left+r3.width/2-br.left;
  const y2=r3.top+r3.height/2-br.top;

  const dx=x2-x1;
  const dy=y2-y1;
  const len=Math.sqrt(dx*dx+dy*dy);
  const angle=Math.atan2(dy,dx)*180/Math.PI;

  const line=document.createElement("div");
  line.className="win-line";
  line.style.width=len+"px";
  line.style.left=x1+"px";
  line.style.top=y1+"px";
  line.style.transform=`rotate(${angle}deg)`;

  line.style.color = current==="X" ? "#00f0ff" : "#ff00cc";

  board.appendChild(line);
}

function checkWin(){
  for(const [a,b,c] of wins){
    if(boardState[a] && boardState[a]===boardState[b] && boardState[a]===boardState[c]){
      drawBeam(a,b,c);
      return true;
    }
  }
  return false;
}

/* ===== CLICK ===== */
board.onclick=e=>{
  const cell=e.target.closest(".cell");
  if(!cell||gameOver) return;
  const i=cell.dataset.i;
  if(boardState[i]) return;

  boardState[i]=current;

  const m=document.createElement("div");
  m.className="mark "+current.toLowerCase();
  m.textContent=current;
  cell.appendChild(m);

  playSound(current==="X"?700:500);

  if(checkWin()){
    gameOver=true;
    updateUI("WINS");
    return;
  }

  if(boardState.every(x=>x)){
    gameOver=true;
    updateUI("DRAW");
    return;
  }

  current=current==="X"?"O":"X";
  updateUI("TURN");
};

/* ===== RESET ===== */
restartBtn.onclick=()=>{
  boardState=Array(9).fill(null);
  current="X";
  gameOver=false;
  document.querySelectorAll(".cell").forEach(c=>c.innerHTML="");
  document.querySelectorAll(".win-line").forEach(l=>l.remove());
  updateUI("TURN");
};

updateUI("TURN");

</script>

</body>
</html>
