<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XO CLASH</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #0b0020, #000);
    overflow: hidden;
}

/* TITLE */
h1 {
    position: absolute;
    top: 40px;
    font-size: 4rem;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #8ff, #f8f);
    -webkit-background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(0,255,255,0.5);
}

/* BOARD WRAPPER */
.game-wrapper {
    position: relative;
}

/* DRAW TEXT */
.draw-text {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 5rem;
    font-weight: 900;
    color: #ff1a1a;
    letter-spacing: 6px;
    z-index: 5;
}

/* PERFECT MIRROR POSITION */
.draw-left {
    left: calc(50% - 420px);
}

.draw-right {
    right: calc(50% - 420px);
}

/* BOARD */
.board {
    width: 300px;
    height: 300px;
    border-radius: 30px;
    padding: 15px;
    background: #111;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;

    box-shadow:
        0 0 30px cyan,
        0 0 80px rgba(0,255,255,0.6),
        inset 0 0 30px rgba(0,255,255,0.4);

    animation: fogPulse 3s infinite alternate;
}

/* FOG PULSE */
@keyframes fogPulse {
    from {
        box-shadow:
            0 0 20px cyan,
            0 0 60px rgba(0,255,255,0.5),
            inset 0 0 20px rgba(0,255,255,0.3);
    }
    to {
        box-shadow:
            0 0 40px cyan,
            0 0 120px rgba(0,255,255,0.9),
            inset 0 0 40px rgba(0,255,255,0.6);
    }
}

/* CELLS */
.cell {
    background: #1a1a2e;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2.5rem;
    font-weight: bold;
    cursor: pointer;

    box-shadow:
        inset 0 0 10px rgba(255,255,255,0.1),
        0 0 10px rgba(0,0,0,0.5);
}

.cell.x {
    color: cyan;
    text-shadow: 0 0 15px cyan;
}

.cell.o {
    color: #ff00cc;
    text-shadow: 0 0 15px #ff00cc;
}

/* STATUS TEXT (TURN / WINS) */
.status-text {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 1.5rem;
    letter-spacing: 4px;
    color: #d9e1e8;

    text-shadow:
        0 0 6px rgba(255,255,255,0.4),
        0 0 12px rgba(180,200,255,0.5),
        0 0 24px rgba(120,180,255,0.35);
}

/* RESTART BUTTON (UNCHANGED SHAPE) */
.restart-btn {
    position: absolute;
    bottom: -90px;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 50px;
    border-radius: 40px;
    border: none;
    cursor: pointer;

    background: linear-gradient(180deg, #b6ff6a, #6aff2b);
    box-shadow:
        0 0 25px rgba(140,255,0,0.8),
        inset 0 0 15px rgba(255,255,255,0.6);

    /* TEXT FIX ONLY */
    font-weight: 900;
    letter-spacing: 2px;
    font-size: 1.4rem;
    color: #0b1a12;

    text-shadow:
        0 1px 0 rgba(255,255,255,0.4),
        0 0 6px rgba(0,0,0,0.25);
}
</style>
</head>

<body>

<h1>XO CLASH</h1>

<div class="game-wrapper">

    <div class="draw-text draw-left">DRAW</div>
    <div class="draw-text draw-right">DRAW</div>

    <div class="status-text" id="status">X TURN</div>

    <div class="board" id="board"></div>

    <button class="restart-btn" onclick="restartGame()">RESTART</button>

</div>

<script>
const board = document.getElementById("board");
const statusText = document.getElementById("status");

let currentPlayer = "X";
let cells = Array(9).fill("");
let gameActive = true;

function createBoard() {
    board.innerHTML = "";
    cells.forEach((_, index) => {
        const cell = document.createElement("div");
        cell.classList.add("cell");
        cell.addEventListener("click", () => handleClick(index));
        board.appendChild(cell);
    });
}

function handleClick(index) {
    if (!gameActive || cells[index] !== "") return;

    cells[index] = currentPlayer;
    updateBoard();

    if (checkWinner()) {
        statusText.textContent = currentPlayer + " WINS";
        gameActive = false;
        return;
    }

    if (!cells.includes("")) {
        statusText.textContent = "DRAW";
        return;
    }

    currentPlayer = currentPlayer === "X" ? "O" : "X";
    statusText.textContent = currentPlayer + " TURN";
}

function updateBoard() {
    const cellDivs = document.querySelectorAll(".cell");
    cellDivs.forEach((cell, i) => {
        cell.textContent = cells[i];
        cell.classList.remove("x", "o");
        if (cells[i] === "X") cell.classList.add("x");
        if (cells[i] === "O") cell.classList.add("o");
    });
}

function checkWinner() {
    const winPatterns = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
    ];

    return winPatterns.some(pattern => {
        const [a,b,c] = pattern;
        return cells[a] && cells[a] === cells[b] && cells[a] === cells[c];
    });
}

function restartGame() {
    cells = Array(9).fill("");
    currentPlayer = "X";
    gameActive = true;
    statusText.textContent = "X TURN";
    createBoard();
}

createBoard();
</script>

</body>
</html>
