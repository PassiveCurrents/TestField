<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>X/O CLASH</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle,#2a0040,#000);
  font-family:sans-serif;
  color:white;
}

/* ===== TITLE ===== */
#title{
  font-size:77px;
  font-weight:900;
  margin-bottom:20px;
  background:linear-gradient(45deg,#00f0ff,#ff00cc,#baff00,#00f0ff);
  background-size:400%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s linear infinite;
  text-shadow:0 0 30px #fff;
}
@keyframes shine{
  0%{background-position:0%}
  100%{background-position:400%}
}

/* ===== LAYOUT ===== */
#game{
  display:flex;
  align-items:center;
  gap:40px;
}

/* SIDE STATUS */
.side{
  width:180px;
  text-align:center;
  font-size:48px;
  font-weight:900;
  letter-spacing:2px;
}

/* SILVER TEXT (WITH GLOW BACK) */
.metal{
  color:#fff;
  text-shadow:
    0 0 10px #fff,
    0 0 25px #fff,
    0 0 50px #fff;
}

/* DRAW */
.draw{
  color:#ff0033;
  font-size:90px;

  text-shadow:
    /* WHITE OUTER COATING */
    0 0 10px #ffffff,
    0 0 25px #ffffff,

    /* RED CORE GLOW */
    0 0 20px #ff0033,
    0 0 40px #ff0033,
    0 0 80px #ff0033;
}

/* ===== BOARD ===== */
#board{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,86px);
  gap:12px;
  padding:20px;
  border-radius:50px;

  background:#20003a;

  border:24px solid #00f0ff;

  box-shadow:
    0 0 80px #00f0ff,
    0 0 150px #00f0ff,
    inset 0 0 40px #00f0ff55;
}

/* SIDE GLOW */
#board::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:-140px;
  right:-140px;
  border-radius:50px;
  pointer-events:none;

  background:radial-gradient(
    ellipse at center,
    rgba(0,240,255,0.35),
    transparent 70%
  );

  animation:sidePulse 2.2s ease-in-out infinite;
}

@keyframes sidePulse{
  0%,100%{
    opacity:0.4;
    transform:scaleX(1);
  }
  50%{
    opacity:1;
    transform:scaleX(1.35);
  }
}

/* CELLS */
.cell{
  width:86px;
  height:86px;
  border-radius:30px;
  background:#3a0060;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    inset 0 0 25px #000,
    0 0 15px #000,
    inset 0 0 20px #ffffff22;
}

/* MARKS */
.mark{
  font-size:64px;
  font-weight:900;
  animation:float 2s ease-in-out infinite;
}

.x{
  color:#00f0ff;
  text-shadow:
    0 0 25px #00f0ff,
    0 0 60px #00f0ff,
    0 0 120px #00f0ff;
}

.o{
  color:#ff00cc;
  text-shadow:
    0 0 25px #ff00cc,
    0 0 60px #ff00cc,
    0 0 120px #ff00cc;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

/* WIN LINE */
.win-line{
  position:absolute;
  height:14px;
  border-radius:20px;
  transform-origin:left center;
}

/* RESTART BUTTON (UNCHANGED CORE) */
#restart{
  margin-top:40px;
  padding:20px 70px;
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;

  border:none;
  border-radius:60px;
  cursor:pointer;

  background:linear-gradient(
    180deg,
    #d4ff4d,
    #a6ff00
  );

  box-shadow:
    0 0 40px #baff00,
    0 0 80px #baff00,
    inset 0 2px 10px rgba(255,255,255,0.6),
    inset 0 -4px 10px rgba(0,0,0,0.4);

  color:#111;

  text-shadow:
    0 1px 0 rgba(255,255,255,0.4),
    0 2px 4px rgba(0,0,0,0.4);

  transition:.15s;
}

#restart:active{
  transform:scale(0.9);
}
</style>
</head>

<body>

<div id="title">X/O CLASH</div>

<div id="game">
  <div id="left" class="side"></div>
  <div id="board"></div>
  <div id="right" class="side"></div>
</div>

<button id="restart">RESTART</button>

<script>
let boardState=Array(9).fill(null);
let current="X";
let gameOver=false;
let swap=false;

const board=document.getElementById("board");
const left=document.getElementById("left");
const right=document.getElementById("right");

/* CREATE GRID */
for(let i=0;i<9;i++){
  const c=document.createElement("div");
  c.className="cell";
  c.dataset.i=i;
  board.appendChild(c);
}

/* UI UPDATE */
function updateUI(text){

  left.className="side";
  right.className="side";

  if(text==="DRAW"){
    left.textContent="DRAW";
    right.textContent="DRAW";

    left.classList.add("draw");
    right.classList.add("draw");

    /* PERFECT SYMMETRY */
    left.style.transform="translateX(-55px)";
    right.style.transform="translateX(55px)";
    return;
  }

  left.style.transform="translateX(-25px)";
  right.style.transform="translateX(25px)";

  if(!swap){
    left.textContent=text.includes("X")?text:"";
    right.textContent=text.includes("O")?text:"";
  }else{
    left.textContent=text.includes("O")?text:"";
    right.textContent=text.includes("X")?text:"";
  }

  if(left.textContent) left.classList.add("metal");
  if(right.textContent) right.classList.add("metal");
}

/* CLICK */
board.onclick=e=>{
  const cell=e.target.closest(".cell");
  if(!cell||gameOver)return;

  const i=cell.dataset.i;
  if(boardState[i])return;

  boardState[i]=current;

  const m=document.createElement("div");
  m.className="mark "+current.toLowerCase();
  m.textContent=current;
  cell.appendChild(m);

  const win=checkWin();

  if(win){
    gameOver=true;
    updateUI(current+" WINS");
    return;
  }

  if(boardState.every(x=>x)){
    gameOver=true;
    updateUI("DRAW");
    return;
  }

  current=current==="X"?"O":"X";
  updateUI(current+" TURN");
};

/* WIN CHECK */
const wins=[
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

function checkWin(){
  return wins.find(([a,b,c])=>
    boardState[a] &&
    boardState[a]===boardState[b] &&
    boardState[a]===boardState[c]
  );
}

/* RESET */
restart.onclick=()=>{
  boardState=Array(9).fill(null);
  current="X";
  gameOver=false;
  swap=!swap;

  document.querySelectorAll(".cell").forEach(c=>c.innerHTML="");
  document.querySelectorAll(".win-line").forEach(l=>l.remove());

  updateUI("X TURN");
};

updateUI("X TURN");
</script>

</body>
</html>
