<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>X/O CLASH</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle,#2a0040,#000);
  font-family:sans-serif;
  color:white;
  overflow:hidden;
}
/* ===== TITLE ===== */
#title{
  font-size:77px;
  font-weight:900;
  margin-bottom:20px;
  background:linear-gradient(45deg,#00f0ff,#ff00cc,#baff00,#00f0ff);
  background-size:400%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s linear infinite;
  text-shadow:0 0 30px #fff;
}
@keyframes shine{
  0%{background-position:0%}
  100%{background-position:400%}
}
/* ===== LAYOUT ===== */
#game{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:220px;
}
.side{
  width:220px;
  text-align:center;
  font-size:48px;
  font-weight:900;
  letter-spacing:2px;
  white-space:nowrap;
  margin-left: -68px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.side .symbol {
  font-size: 82px;
  font-weight: 900;
  line-height: 1;
  color: #ffffff;
  text-shadow:
    0 0 12px #ffffff,
    0 0 28px #d0f0ff,
    0 0 50px #ffffff;
}
.side .label {
  display:block;
}
.metal{
  color:#fff;
  text-shadow:
    0 0 10px #fff,
    0 0 25px #fff,
    0 0 50px #fff;
}
.draw{
  color:#ff0033;
  font-size:90px;
  text-shadow:
    0 0 10px #ffffff,
    0 0 25px #ffffff,
    0 0 20px #ff0033,
    0 0 40px #ff0033,
    0 0 80px #ff0033;
  animation: drawPulse 3.2s ease-in-out infinite;
}
@keyframes drawPulse {
  0%, 100% { opacity: 0.92; }
  50% { opacity: 1; }
}

/* ===== BOARD ===== */
#board{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,86px);
  gap:12px;
  padding:20px;
  border-radius:50px;
  background:#20003a;
  border:24px solid #00f0ff;
  box-shadow:
    0 0 80px #00f0ff,
    0 0 150px #00f0ff,
    inset 0 0 40px #00f0ff55;
}

/* ✅ FIXED OVERLAY (NO OFFSET, NO EXPANSION) */
#winBeam{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:10;
  opacity:0;
  transition: opacity 0.4s ease-out;
}

#winBeam svg{
  width:100%;
  height:100%;
  filter: drop-shadow(0 0 25px currentColor);
}

#winBeam line{
  stroke: currentColor;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-width: 18;
  filter: brightness(1.4) drop-shadow(0 0 12px currentColor);
  animation: beamSettle 1.2s ease-out forwards;
}

@keyframes beamSettle{
  0%{
    stroke-width: 32;
    opacity: 0.95;
  }
  100%{
    stroke-width: 11;
    opacity: 1;
  }
}

/* FOG */
#board::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:-140px;
  right:-140px;
  border-radius:50px;
  pointer-events:none;
  background:radial-gradient(
    ellipse at center,
    rgba(0,240,255,0.35),
    transparent 70%
  );
  animation:sidePulse 2.2s ease-in-out infinite;
}

@keyframes sidePulse{
  0%,100%{ opacity:0.4; transform:scaleX(1); }
  50%{ opacity:1; transform:scaleX(1.35); }
}

/* CELLS */
.cell{
  width:86px;
  height:86px;
  border-radius:30px;
  background:#3a0060;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 25px #000,
    0 0 15px #000,
    inset 0 0 20px #ffffff22;
}

/* MARKS */
.mark{
  font-size:64px;
  font-weight:900;
  animation:float 2s ease-in-out infinite;
}
.x{
  color:#00f0ff;
  text-shadow:
    0 0 25px #00f0ff,
    0 0 60px #00f0ff,
    0 0 120px #00f0ff;
}
.o{
  color:#ff00cc;
  text-shadow:
    0 0 25px #ff00cc,
    0 0 60px #ff00cc,
    0 0 120px #ff00cc;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

/* BUTTON */
#restart{
  margin-top:40px;
  padding:18px 80px;
  font-size:24px;
  font-weight:900;
  letter-spacing:3px;
  border:none;
  border-radius:60px;
  cursor:pointer;
  background:linear-gradient(180deg, #d4ff4d, #a6ff00);
  color:#111;
  text-shadow:
    0 1px 0 rgba(255,255,255,0.5),
    0 2px 4px rgba(0,0,0,0.4);
  box-shadow:
    0 0 40px #baff00,
    0 0 80px #baff00,
    inset 0 4px 12px rgba(255,255,255,0.7),
    inset 0 -6px 12px rgba(0,0,0,0.3);
  position: relative;
  overflow: hidden;
}
#restart:active{
  transform:scale(0.93);
}
</style>
</head>
<body>

<div id="title">X/O CLASH</div>

<div id="game">
  <div id="left" class="side"></div>

  <div id="board">
    <div id="winBeam"></div>
  </div>

  <div id="right" class="side"></div>
</div>

<button id="restart">RESTART</button>

<script>
let boardState = Array(9).fill(null);
let current = "X";
let gameOver = false;
let swap = false;

const board = document.getElementById("board");
const left = document.getElementById("left");
const right = document.getElementById("right");
const restartBtn = document.getElementById("restart");
const winBeam = document.getElementById("winBeam");

/* CREATE GRID */
for(let i = 0; i < 9; i++){
  const c = document.createElement("div");
  c.className = "cell";
  c.dataset.i = i;
  board.appendChild(c);
}

/* ✅ TRUE CENTER (NO OFFSETS ANYMORE) */
function getCellCenter(index) {
  const cell = document.querySelectorAll(".cell")[index];
  const rect = cell.getBoundingClientRect();
  const boardRect = board.getBoundingClientRect();

  return {
    x: rect.left + rect.width / 2 - boardRect.left,
    y: rect.top + rect.height / 2 - boardRect.top
  };
}

/* ✅ PERFECTLY ALIGNED BEAM */
function drawWinBeam(winCombo) {
  if (!winCombo) return;

  const [a, , c] = winCombo;
  const start = getCellCenter(a);
  const end = getCellCenter(c);

  const color = current === "X" ? "#00f0ff" : "#ff00cc";

  winBeam.innerHTML = `
    <svg viewBox="0 0 ${board.clientWidth} ${board.clientHeight}">
      <line 
        x1="${start.x}" y1="${start.y}" 
        x2="${end.x}" y2="${end.y}"
        stroke="${color}"
      />
    </svg>
  `;

  winBeam.style.color = color;
  winBeam.style.opacity = "1";
}

/* GAME LOGIC (unchanged) */
board.onclick = e => {
  const cell = e.target.closest(".cell");
  if(!cell || gameOver) return;

  const i = parseInt(cell.dataset.i);
  if(boardState[i]) return;

  boardState[i] = current;

  const m = document.createElement("div");
  m.className = "mark " + current.toLowerCase();
  m.textContent = current;
  cell.appendChild(m);

  const winCombo = checkWin();

  if(winCombo){
    gameOver = true;
    drawWinBeam(winCombo);
    updateUI(current + " WINS");
    return;
  }

  if(boardState.every(x => x)){
    gameOver = true;
    updateUI("DRAW");
    return;
  }

  current = current === "X" ? "O" : "X";
  updateUI(current + " TURN");
};

const wins = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function checkWin(){
  return wins.find(([a,b,c]) =>
    boardState[a] &&
    boardState[a] === boardState[b] &&
    boardState[a] === boardState[c]
  );
}

restartBtn.onclick = () => {
  boardState = Array(9).fill(null);
  current = "X";
  gameOver = false;
  swap = !swap;

  document.querySelectorAll(".cell").forEach(c => c.innerHTML = "");
  winBeam.innerHTML = "";
  winBeam.style.opacity = "0";

  updateUI("X TURN");
};

function updateUI(text){
  left.innerHTML = "";
  right.innerHTML = "";

  if(text === "DRAW"){
    left.innerHTML = `<span class="draw">DRAW</span>`;
    right.innerHTML = `<span class="draw">DRAW</span>`;
    return;
  }

  const symbol = current;
  const target = text.includes("X") ? left : right;

  target.innerHTML = `
    <span class="symbol">${symbol}</span>
    <span class="label">${text.replace(symbol,"")}</span>
  `;
}

updateUI("X TURN");
</script>
</body>
</html>
