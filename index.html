<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<title>X/O CLASH</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle,#2a0040,#000);
  font-family:sans-serif;
  color:white;
  overflow:hidden;
}

/* ===== TITLE ===== */
#title{
  font-size:77px;
  font-weight:900;
  margin-bottom:20px;
  background:linear-gradient(45deg,#00f0ff,#ff00cc,#baff00,#00f0ff);
  background-size:400%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s linear infinite;
  text-shadow:0 0 30px #fff;
}
@keyframes shine{
  0%{background-position:0%}
  100%{background-position:400%}
}

/* ===== LAYOUT ===== */
#game{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:220px;
}

/* SIDE STATUS */
.side{
  width:220px;
  text-align:center;
  font-size:48px;
  font-weight:900;
  letter-spacing:2px;
  white-space:nowrap;
  margin-left: -68px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

/* SYMBOL ABOVE TEXT */
.side .symbol {
  font-size: 82px;
  font-weight: 900;
  line-height: 1;
  color: #ffffff;
  text-shadow:
    0 0 12px #ffffff,
    0 0 28px #d0f0ff,
    0 0 50px #ffffff;
}

/* TEXT UNDER SYMBOL */
.side .label {
  display:block;
}

/* METAL TEXT */
.metal{
  color:#fff;
  text-shadow:
    0 0 10px #fff,
    0 0 25px #fff,
    0 0 50px #fff;
}

/* DRAW TEXT */
.draw{
  color:#ff0033;
  font-size:90px;
  text-shadow:
    0 0 10px #ffffff,
    0 0 25px #ffffff,
    0 0 20px #ff0033,
    0 0 40px #ff0033,
    0 0 80px #ff0033;
  animation: drawPulse 3.2s ease-in-out infinite;
}

/* ===== BOARD ===== */
#board{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,86px);
  gap:12px;
  padding:20px;
  border-radius:50px;
  background:#20003a;
  border:24px solid #00f0ff;
  box-shadow:
    0 0 80px #00f0ff,
    0 0 150px #00f0ff,
    inset 0 0 40px #00f0ff55;
}

/* WIN CANVAS */
#winCanvas{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:10;
  pointer-events:none;
}

/* CELLS */
.cell{
  width:86px;
  height:86px;
  border-radius:30px;
  background:#3a0060;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 25px #000,
    0 0 15px #000,
    inset 0 0 20px #ffffff22;
}

/* MARKS */
.mark{
  font-size:64px;
  font-weight:900;
}
.x{
  color:#00f0ff;
  text-shadow:0 0 30px #00f0ff,0 0 80px #00f0ff;
}
.o{
  color:#ff00cc;
  text-shadow:0 0 30px #ff00cc,0 0 80px #ff00cc;
}

/* BUTTON */
#restart{
  margin-top:40px;
  padding:18px 80px;
  font-size:24px;
  font-weight:900;
  border:none;
  border-radius:60px;
  cursor:pointer;
  background:linear-gradient(180deg, #d4ff4d, #a6ff00);
}
</style>
</head>
<body>

<div id="title">X/O CLASH</div>

<div id="game">
  <div id="left" class="side"></div>
  <div id="board"></div>
  <div id="right" class="side"></div>
</div>

<button id="restart">RESTART</button>

<script>
let boardState = Array(9).fill(null);
let current = "X";
let gameOver = false;
let swap = false;

const board = document.getElementById("board");
const left = document.getElementById("left");
const right = document.getElementById("right");
const restartBtn = document.getElementById("restart");

/* CANVAS */
const canvas = document.createElement("canvas");
canvas.id = "winCanvas";
board.appendChild(canvas);
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = board.clientWidth;
  canvas.height = board.clientHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

/* GRID */
for(let i = 0; i < 9; i++){
  const c = document.createElement("div");
  c.className = "cell";
  c.dataset.i = i;
  board.appendChild(c);
}

/* DRAW BEAM */
function drawWinLine(combo, player){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const color = player === "X" ? "#00f0ff" : "#ff00cc";

  ctx.strokeStyle = color;
  ctx.lineWidth = 20;
  ctx.lineCap = "round";
  ctx.shadowColor = color;
  ctx.shadowBlur = 40;

  ctx.beginPath();

  const w = canvas.width;
  const h = canvas.height;

  // HORIZONTAL
  if(combo[0] === 0 && combo[2] === 2){
    ctx.moveTo(40, h/6);
    ctx.lineTo(w-40, h/6);
  }
  else if(combo[0] === 3 && combo[2] === 5){
    ctx.moveTo(40, h/2);
    ctx.lineTo(w-40, h/2);
  }
  else if(combo[0] === 6 && combo[2] === 8){
    ctx.moveTo(40, h*5/6);
    ctx.lineTo(w-40, h*5/6);
  }

  // VERTICAL
  else if(combo[0] === 0 && combo[2] === 6){
    ctx.moveTo(w/6, 40);
    ctx.lineTo(w/6, h-40);
  }
  else if(combo[0] === 1 && combo[2] === 7){
    ctx.moveTo(w/2, 40);
    ctx.lineTo(w/2, h-40);
  }
  else if(combo[0] === 2 && combo[2] === 8){
    ctx.moveTo(w*5/6, 40);
    ctx.lineTo(w*5/6, h-40);
  }

  // DIAGONALS
  else if(combo[0] === 0 && combo[2] === 8){
    ctx.moveTo(40, 40);
    ctx.lineTo(w-40, h-40);
  }
  else if(combo[0] === 2 && combo[2] === 6){
    ctx.moveTo(w-40, 40);
    ctx.lineTo(40, h-40);
  }

  ctx.stroke();
}

/* CLICK */
board.onclick = e => {
  const cell = e.target.closest(".cell");
  if(!cell || gameOver) return;

  const i = cell.dataset.i;
  if(boardState[i]) return;

  boardState[i] = current;

  const m = document.createElement("div");
  m.className = "mark " + current.toLowerCase();
  m.textContent = current;
  cell.appendChild(m);

  const win = checkWin();

  if(win){
    gameOver = true;
    drawWinLine(win, current);
    updateUI(current + " WINS");
    return;
  }

  if(boardState.every(x => x)){
    gameOver = true;
    updateUI("DRAW");
    return;
  }

  current = current === "X" ? "O" : "X";
  updateUI(current + " TURN");
};

/* WIN CHECK */
const wins = [
  [0,1,2],[3,4,5],[6,7,8],
  [0,3,6],[1,4,7],[2,5,8],
  [0,4,8],[2,4,6]
];

function checkWin(){
  return wins.find(([a,b,c]) =>
    boardState[a] &&
    boardState[a]===boardState[b] &&
    boardState[a]===boardState[c]
  );
}

/* UI */
function updateUI(text){
  left.innerHTML = text;
  right.innerHTML = text;
}

/* RESET */
restartBtn.onclick = () => {
  boardState = Array(9).fill(null);
  current = "X";
  gameOver = false;

  document.querySelectorAll(".cell").forEach(c => c.innerHTML = "");
  ctx.clearRect(0,0,canvas.width,canvas.height);

  updateUI("X TURN");
};

updateUI("X TURN");
</script>

</body>
</html>
