<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<title>X/O CLASH</title>
<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:radial-gradient(circle,#2a0040,#000);
  font-family:sans-serif;
  color:white;
  overflow:hidden;
}

/* ===== TITLE ===== */
#title{
  font-size:77px;
  font-weight:900;
  margin-bottom:20px;
  background:linear-gradient(45deg,#00f0ff,#ff00cc,#baff00,#00f0ff);
  background-size:400%;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 6s linear infinite;
  text-shadow:0 0 30px #fff;
}
@keyframes shine{
  0%{background-position:0%}
  100%{background-position:400%}
}

/* ===== LAYOUT ===== */
#game{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:220px;
}

/* SIDE STATUS */
.side{
  width:220px;
  text-align:center;
  font-size:48px;
  font-weight:900;
  letter-spacing:2px;
  white-space:nowrap;
  margin-left: -68px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

/* SYMBOL ABOVE TEXT */
.side .symbol {
  font-size:82px;
  font-weight:900;
  line-height:1;
  color:#ffffff;
  text-shadow:
    0 0 12px #ffffff,
    0 0 28px #d0f0ff,
    0 0 50px #ffffff;
}

/* TEXT UNDER SYMBOL */
.side .label {
  display:block;
}

/* METAL TEXT */
.metal{
  color:#fff;
  text-shadow:
    0 0 10px #fff,
    0 0 25px #fff,
    0 0 50px #fff;
}

/* DRAW TEXT */
.draw{
  color:#ff0033;
  font-size:90px;
  text-shadow:
    0 0 10px #ffffff,
    0 0 25px #ffffff,
    0 0 20px #ff0033,
    0 0 40px #ff0033,
    0 0 80px #ff0033;
  animation: drawPulse 3.2s ease-in-out infinite;
}
@keyframes drawPulse {
  0%,100%{opacity:0.92;}
  50%{opacity:1;}
}

/* ===== BOARD ===== */
#board{
  position:relative;
  display:grid;
  grid-template-columns:repeat(3,86px);
  gap:12px;
  padding:20px;
  border-radius:50px;
  background:#20003a;
  border:24px solid #00f0ff;
  box-shadow:
    0 0 80px #00f0ff,
    0 0 150px #00f0ff,
    inset 0 0 40px #00f0ff55;
}

/* ✅ FIXED CANVAS */
#winCanvas{
  position:absolute;
  top:20px;
  left:20px;
  pointer-events:none;
  z-index:50;
}

/* FOG */
#board::before{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  left:-140px;
  right:-140px;
  border-radius:50px;
  pointer-events:none;
  background:radial-gradient(
    ellipse at center,
    rgba(0,240,255,0.35),
    transparent 70%
  );
  animation:sidePulse 2.2s ease-in-out infinite;
}
@keyframes sidePulse{
  0%,100%{ opacity:0.4; transform:scaleX(1); }
  50%{ opacity:1; transform:scaleX(1.35); }
}

/* CELLS */
.cell{
  width:86px;
  height:86px;
  border-radius:30px;
  background:#3a0060;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:
    inset 0 0 25px #000,
    0 0 15px #000,
    inset 0 0 20px #ffffff22;
}

/* MARKS */
.mark{
  font-size:64px;
  font-weight:900;
  animation:float 2s ease-in-out infinite;
}
.x{
  color:#00f0ff;
  text-shadow:0 0 25px #00f0ff,0 0 60px #00f0ff,0 0 120px #00f0ff;
}
.o{
  color:#ff00cc;
  text-shadow:0 0 25px #ff00cc,0 0 60px #ff00cc,0 0 120px #ff00cc;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-10px)}
}

/* BUTTON */
#restart{
  margin-top:40px;
  padding:18px 80px;
  font-size:24px;
  font-weight:900;
  letter-spacing:3px;
  border:none;
  border-radius:60px;
  cursor:pointer;
  background:linear-gradient(180deg,#d4ff4d,#a6ff00);
  color:#111;
}
</style>
</head>
<body>

<div id="title">X/O CLASH</div>

<div id="game">
  <div id="left" class="side"></div>
  <div id="board"></div>
  <div id="right" class="side"></div>
</div>

<button id="restart">RESTART</button>

<script>
let boardState = Array(9).fill(null);
let current = "X";
let gameOver = false;
let swap = false;

const board = document.getElementById("board");
const left = document.getElementById("left");
const right = document.getElementById("right");
const restartBtn = document.getElementById("restart");

/* ===== CANVAS ===== */
const canvas = document.createElement("canvas");
canvas.id = "winCanvas";
board.appendChild(canvas);
const ctx = canvas.getContext("2d");

/* ✅ FIXED RESIZE */
function resizeCanvas(){
  const cells = document.querySelectorAll(".cell");
  if(!cells.length) return;

  const first = cells[0].getBoundingClientRect();
  const last = cells[8].getBoundingClientRect();

  const width = last.right - first.left;
  const height = last.bottom - first.top;

  const dpr = window.devicePixelRatio || 1;

  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  canvas.width = width * dpr;
  canvas.height = height * dpr;

  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", resizeCanvas);

/* CREATE GRID */
for(let i = 0; i < 9; i++){
  const c = document.createElement("div");
  c.className = "cell";
  c.dataset.i = i;
  board.appendChild(c);
}
resizeCanvas();

/* ===== FIXED BEAM ===== */
function drawWinLine(combo, player){
  const cells = [...document.querySelectorAll(".cell")];

  const base = cells[0].getBoundingClientRect();

  const getCenter = (el)=>{
    const r = el.getBoundingClientRect();
    return {
      x: r.left - base.left + r.width/2,
      y: r.top - base.top + r.height/2
    };
  };

  const start = getCenter(cells[combo[0]]);
  const end = getCenter(cells[combo[2]]);

  const color = player === "X" ? "#00ffff" : "#ff00cc";

  let startTime = performance.now();

  function animate(t){
    let p = Math.min((t - startTime)/900,1);

    ctx.clearRect(0,0,canvas.width,canvas.height);

    const layers = [
      {w:48 - p*30, blur:60 - p*40, a:0.9},
      {w:28 - p*16, blur:35 - p*20, a:1},
      {w:16 - p*6, blur:20 - p*10, a:1}
    ];

    layers.forEach(L=>{
      ctx.globalAlpha = L.a;
      ctx.strokeStyle = color;
      ctx.shadowColor = color;
      ctx.shadowBlur = L.blur;
      ctx.lineWidth = Math.max(L.w,8);
      ctx.lineCap="round";

      ctx.beginPath();
      ctx.moveTo(start.x,start.y);
      ctx.lineTo(end.x,end.y);
      ctx.stroke();
    });

    ctx.globalAlpha = 1;

    if(p<1) requestAnimationFrame(animate);
  }

  requestAnimationFrame(animate);
}

/* CLICK */
board.onclick = e => {
  const cell = e.target.closest(".cell");
  if(!cell || gameOver) return;

  const i = cell.dataset.i;
  if(boardState[i]) return;

  boardState[i] = current;

  const m = document.createElement("div");
  m.className = "mark " + current.toLowerCase();
  m.textContent = current;
  cell.appendChild(m);

  const win = checkWin();

  if(win){
    gameOver = true;
    drawWinLine(win, current);
    return;
  }

  if(boardState.every(x => x)){
    gameOver = true;
    return;
  }

  current = current === "X" ? "O" : "X";
};

/* WIN */
const wins = [
[0,1,2],[3,4,5],[6,7,8],
[0,3,6],[1,4,7],[2,5,8],
[0,4,8],[2,4,6]
];

function checkWin(){
  return wins.find(([a,b,c]) =>
    boardState[a] &&
    boardState[a]===boardState[b] &&
    boardState[a]===boardState[c]
  );
}

/* RESET */
restartBtn.onclick = () => {
  boardState = Array(9).fill(null);
  current = "X";
  gameOver = false;
  swap = !swap;

  document.querySelectorAll(".cell").forEach(c => c.innerHTML = "");
  ctx.clearRect(0,0,canvas.width,canvas.height);
};
</script>

</body>
</html>
